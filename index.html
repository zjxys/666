<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板 + 点赞 + AI 答疑</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #333;
      max-width: 640px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    h1 { text-align: center; margin-bottom: 30px; color: #1a1a1a; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: #666; }

    /* 点赞区 */
    .like-section { text-align: center; }
    .like-btn {
      background: none;
      border: 2px solid #ff4d4f;
      color: #ff4d4f;
      font-size: 1.2rem;
      padding: 8px 24px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .like-btn:hover { background: #ff4d4f; color: #fff; }
    .like-btn.liked { background: #ff4d4f; color: #fff; }
    .like-count { font-weight: bold; margin-left: 8px; }

    /* 留言列表 */
    #guestbook-list {
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .msg {
      margin-bottom: 8px;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 0.9rem;
      animation: slideIn 0.25s ease;
    }
    .msg .name { font-weight: bold; color: #0066cc; }
    .msg .time { color: #999; font-size: 0.75rem; display: block; margin-top: 2px; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 输入区 */
    .input-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .input-group input {
      flex: 1;
      min-width: 100px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .input-group input:focus { border-color: #0066cc; }
    .input-group button {
      padding: 10px 20px;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .input-group button:hover { opacity: 0.9; }
    .empty-tip { text-align: center; color: #bbb; padding: 20px; }

    /* AI 答疑区 */
    #qa-list {
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .qa-msg { margin-bottom: 12px; }
    .qa-user {
      background: #0066cc;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px 8px 0 8px;
      margin-left: 40px;
      font-size: 0.9rem;
    }
    .qa-ai {
      background: #f0f0f0;
      padding: 8px 12px;
      border-radius: 8px 8px 8px 0;
      margin-right: 40px;
      font-size: 0.9rem;
      margin-top: 6px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .qa-ai.loading { color: #999; font-style: italic; }
  </style>
</head>
<body>
  <h1>留言板 + 点赞 + AI 答疑</h1>

  <!-- 点赞区 -->
  <div class="card like-section">
    <h2>给这个页面点个赞</h2>
    <button class="like-btn" id="like-btn" onclick="toggleLike()">
      👍 赞 <span class="like-count" id="like-count">0</span>
    </button>
  </div>

  <!-- AI 答疑区 -->
  <div class="card">
    <h2>AI 答疑(通义千问)</h2>
    <div id="qa-list">
      <div class="empty-tip">有什么问题尽管问我~</div>
    </div>
    <div class="input-group">
      <input id="qa-input" placeholder="输入你的问题..." onkeypress="qaEnter(event)">
      <button onclick="askAI()">提问</button>
    </div>
  </div>

  <!-- 留言区 -->
  <div class="card">
    <h2>留言板</h2>
    <div id="guestbook-list">
      <div class="empty-tip">还没有留言,快来抢沙发~</div>
    </div>
    <div class="input-group">
      <input id="gb-name" placeholder="你的名字" maxlength="20">
      <input id="gb-msg" placeholder="写点什么..." maxlength="200" onkeypress="handleEnter(event)">
      <button onclick="signGuestbook()">留言</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ====== Supabase 配置(换成你自己的) ======
    const SUPABASE_URL = "https://ljmjwqjmbpnhrwrbuxkc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_I3wka1FDH4EiZuEFOyEm8A_421_fHwY";

    // ====== 通义千问 API 配置(换成你自己的) ======
    const DASHSCOPE_API_KEY = sk-ws-H.EXHXPDD.0JVT.MEUCIAFoh5mSmmyKSiKwt3DaEkfGoO1gnHL5FZkJZoHZpnr0AiEA_sSef_bPihEgt-aSX_ifidZ7gOgDI6JmiezA08zviuY    const QWEN_MODEL = "qwen-plus";
    // ============================================

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ARTICLE_SLUG = "home-page";

    const gbList = document.getElementById("guestbook-list");
    const likeBtn = document.getElementById("like-btn");
    const likeCountEl = document.getElementById("like-count");
    const qaList = document.getElementById("qa-list");
    const qaInput = document.getElementById("qa-input");

    // ====== AI 答疑逻辑 ======

    const chatHistory = [
      { role: "system", content: "你是一个友好的助手,请用中文简洁地回答问题,每次回答不超过200字。" }
    ];

    window.askAI = async function() {
      const question = qaInput.value.trim();
      if (!question) return;
      if (DASHSCOPE_API_KEY === "sk-你的阿里云百炼APIKey") {
        alert("请先在代码里填入你的阿里云百炼 API Key!");
        return;
      }

      // 清掉空提示
      const empty = qaList.querySelector(".empty-tip");
      if (empty) qaList.innerHTML = "";

      // 显示用户问题
      const userDiv = document.createElement("div");
      userDiv.className = "qa-msg";
      userDiv.innerHTML = `<div class="qa-user">${escapeHtml(question)}</div>`;
      qaList.appendChild(userDiv);

      // 显示 AI 加载中
      const aiDiv = document.createElement("div");
      aiDiv.className = "qa-msg";
      aiDiv.innerHTML = `<div class="qa-ai loading">正在思考中...</div>`;
      qaList.appendChild(aiDiv);
      qaList.scrollTop = qaList.scrollHeight;

      // 记录对话历史
      chatHistory.push({ role: "user", content: question });

      try {
        const response = await fetch(
          "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${DASHSCOPE_API_KEY}`
            },
            body: JSON.stringify({
              model: QWEN_MODEL,
              messages: chatHistory
            })
          }
        );

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`API 错误 ${response.status}: ${errText}`);
        }

        const data = await response.json();
        const answer = data.choices[0].message.content;

        // 记录 AI 回复
        chatHistory.push({ role: "assistant", content: answer });

        // 显示 AI 回复
        aiDiv.querySelector(".qa-ai").textContent = answer;
        aiDiv.querySelector(".qa-ai").classList.remove("loading");
        qaList.scrollTop = qaList.scrollHeight;
      } catch (err) {
        aiDiv.querySelector(".qa-ai").textContent = "回答失败: " + err.message;
        aiDiv.querySelector(".qa-ai").classList.remove("loading");
        console.error("AI 答疑出错:", err);
      }

      qaInput.value = "";
    };

    function qaEnter(e) {
      if (e.key === "Enter") window.askAI();
    }
    window.qaEnter = qaEnter;

    // ====== 留言板逻辑 ======

    async function loadGuestbook() {
      const { data, error } = await supabase
        .from("guestbook")
        .select("*")
        .order("id", { ascending: false })
        .limit(50);

      if (error) {
        console.error("加载留言失败:", error);
        return;
      }
      renderGuestbook(data || []);
    }

    function renderGuestbook(data) {
      if (data.length === 0) {
        gbList.innerHTML = '<div class="empty-tip">还没有留言,快来抢沙发~</div>';
        return;
      }
      gbList.innerHTML = "";
      data.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `
          <span class="name">${escapeHtml(m.name)}</span>: ${escapeHtml(m.message)}
          <span class="time">${new Date(m.created_at).toLocaleString("zh-CN")}</span>
        `;
        gbList.appendChild(div);
      });
    }

    window.signGuestbook = async function() {
      const name = document.getElementById("gb-name").value.trim() || "匿名";
      const msg = document.getElementById("gb-msg").value.trim();
      if (!msg) return alert("请输入留言内容");

      const { error } = await supabase
        .from("guestbook")
        .insert([{ name, message: msg }]);

      if (error) {
        alert("留言失败,请稍后重试");
        console.error(error);
        return;
      }
      document.getElementById("gb-msg").value = "";
    };

    // 实时监听新留言
    supabase
      .channel("guestbook-realtime")
      .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "guestbook" },
        (payload) => {
          const m = payload.new;
          const empty = gbList.querySelector(".empty-tip");
          if (empty) gbList.innerHTML = "";

          const div = document.createElement("div");
          div.className = "msg";
          div.innerHTML = `
            <span class="name">${escapeHtml(m.name)}</span>: ${escapeHtml(m.message)}
            <span class="time">${new Date(m.created_at).toLocaleString("zh-CN")}</span>
          `;
          gbList.insertBefore(div, gbList.firstChild);
        }
      )
      .subscribe();

    function handleEnter(e) {
      if (e.key === "Enter") window.signGuestbook();
    }
    window.handleEnter = handleEnter;

    // ====== 点赞逻辑 ======

    async function loadLikeCount() {
      const { data } = await supabase
        .from("article_like")
        .select("*")
        .eq("article", ARTICLE_SLUG)
        .maybeSingle();

      const count = data?.like_count || 0;
      likeCountEl.textContent = count;

      const liked = localStorage.getItem(`liked-${ARTICLE_SLUG}`);
      if (liked) likeBtn.classList.add("liked");
    }

    window.toggleLike = async function() {
      if (likeBtn.classList.contains("liked")) {
        return;
      }

      const { data } = await supabase
        .from("article_like")
        .select("*")
        .eq("article", ARTICLE_SLUG)
        .maybeSingle();

      if (data) {
        await supabase
          .from("article_like")
          .update({ like_count: data.like_count + 1 })
          .eq("article", ARTICLE_SLUG);
        likeCountEl.textContent = data.like_count + 1;
      } else {
        await supabase
          .from("article_like")
          .insert([{ article: ARTICLE_SLUG, like_count: 1 }]);
        likeCountEl.textContent = 1;
      }

      likeBtn.classList.add("liked");
      localStorage.setItem(`liked-${ARTICLE_SLUG}`, "1");
    };

    // 简单转义,防 XSS
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    // 初始化
    loadGuestbook();
    loadLikeCount();
  </script>
</body>
</html>
